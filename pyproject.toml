[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexroute"
version = "0.1.0"
description = "Fast zero-shot and few-shot LLM routing powered by Jev"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ReflexRoute contributors" }]
keywords = ["llm", "router", "jev", "openrouter", "zero-shot", "few-shot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AIGNLAI/ReflexRoute"
Repository = "https://github.com/AIGNLAI/ReflexRoute.git"
Issues = "https://github.com/AIGNLAI/ReflexRoute/issues"
Changelog = "https://github.com/AIGNLAI/ReflexRoute/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
benchmark = ["pandas>=2.0"]

[project.scripts]
reflexroute = "reflexroute.cli:main"

[tool.setuptools]
packages = ["reflexroute"]
include-package-data = true

[tool.setuptools.package-data]
reflexroute = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
