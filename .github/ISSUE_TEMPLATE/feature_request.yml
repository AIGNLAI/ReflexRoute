name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What routing problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and public API, if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or competing designs you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps deterministic hard constraints outside the model.
          required: true
        - label: This does not require router training for the core workflow.
          required: true
